<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LifeOS — Tu día, visualizado</title>
<meta name="description" content="LifeOS: planner diario y hábitos. Tu día en una línea de tiempo, sin cuentas y con tus datos en tu dispositivo.">
<meta name="theme-color" content="#0B0B11">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LifeOS">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
  /* First paint: dark canvas + mark, before any script or stylesheet arrives. */
  html, body { margin: 0; background: #0B0B11; }
  .lo-boot { position: fixed; inset: 0; z-index: 100; background: #0B0B11; display: flex; align-items: center; justify-content: center; transition: opacity .35s ease-out; }
  .lo-boot.gone { opacity: 0; pointer-events: none; }
  .lo-boot-mark { width: 84px; height: 84px; border-radius: 24px; background: linear-gradient(160deg, #F0463A, #D41F14); box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 12px 32px rgba(224,36,27,.38); display: flex; align-items: center; justify-content: center; color: #fff; font: 700 42px/1 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; letter-spacing: -1px; animation: lo-boot-pulse 1.4s ease-in-out infinite; }
  @keyframes lo-boot-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  @media (prefers-reduced-motion: reduce) { .lo-boot-mark { animation: none; } }
</style>
</head>
<body>
<div class="lo-boot" id="lo-boot" aria-hidden="true"><div class="lo-boot-mark">L</div></div>
<div id="root"></div>
<noscript>
  <div style="position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;color:#fff;background:#0B0B11;font-family:system-ui,sans-serif;padding:24px;text-align:center">
    LifeOS necesita JavaScript activado para funcionar.
  </div>
</noscript>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
