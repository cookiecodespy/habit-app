<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>LifeOS</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{height:100%;background:#000}
  body{
    height:100%;
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',sans-serif;
    background:#000;color:#FFF;overflow:hidden;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  #root{height:100%}
  ::-webkit-scrollbar{display:none}
  input,select,textarea{font-family:inherit;outline:none;-webkit-appearance:none}
  input[type=date],input[type=time]{color-scheme:dark}
  input[type=range]{-webkit-appearance:none;height:4px;border-radius:2px;background:rgba(84,84,88,0.5)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:24px;height:24px;border-radius:50%;
    background:#FFF;box-shadow:0 2px 8px rgba(0,0,0,.5),0 0 0 0.5px rgba(255,255,255,0.3);cursor:pointer;
  }
  details summary{list-style:none}
  details summary::-webkit-details-marker{display:none}

  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes scaleIn{from{opacity:0;transform:scale(0.94)}to{opacity:1;transform:scale(1)}}
  @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
  .fade-up{animation:fadeUp .3s cubic-bezier(.34,1.2,.64,1) both}
  .scale-in{animation:scaleIn .25s cubic-bezier(.34,1.2,.64,1) both}

  /* ── Ambient Background ── */
  body::before{
    content:'';
    position:fixed;inset:0;
    background:
      radial-gradient(ellipse at 15% 40%,rgba(94,92,230,0.18) 0%,transparent 55%),
      radial-gradient(ellipse at 85% 10%,rgba(191,90,242,0.14) 0%,transparent 50%),
      radial-gradient(ellipse at 65% 85%,rgba(10,132,255,0.10) 0%,transparent 50%),
      radial-gradient(ellipse at 30% 90%,rgba(48,209,88,0.06) 0%,transparent 45%);
    pointer-events:none;z-index:0;
  }

  /* ── Shell ── */
  #shell{
    max-width:430px;margin:0 auto;height:100vh;
    display:flex;flex-direction:column;
    position:relative;overflow:hidden;
    background:transparent;
    z-index:1;
  }
  @media(min-width:520px){
    body{background:#0a0a0f}
    #shell{
      box-shadow:
        0 0 0 0.5px rgba(255,255,255,0.07),
        0 30px 100px rgba(0,0,0,.95),
        inset 0 0 0 0.5px rgba(255,255,255,0.04);
      border-radius:0;
    }
  }

  /* ── Screen ── */
  .screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
  .screen-pad{padding:60px 16px 108px}

  /* ── Glass card base ── */
  .glass{
    background:rgba(28,28,30,0.78);
    backdrop-filter:blur(40px) saturate(180%);
    -webkit-backdrop-filter:blur(40px) saturate(180%);
    border:0.5px solid rgba(255,255,255,0.10);
  }
  .glass-bright{
    background:rgba(44,44,46,0.72);
    backdrop-filter:blur(40px) saturate(180%);
    -webkit-backdrop-filter:blur(40px) saturate(180%);
    border:0.5px solid rgba(255,255,255,0.13);
  }

  /* ── Bottom nav ── */
  .nav{
    position:absolute;bottom:0;left:0;right:0;
    height:83px;
    background:rgba(18,18,20,0.88);
    backdrop-filter:blur(50px) saturate(200%);
    -webkit-backdrop-filter:blur(50px) saturate(200%);
    border-top:0.5px solid rgba(255,255,255,0.10);
    display:flex;padding:0 4px;
    padding-bottom:env(safe-area-inset-bottom,16px);
    z-index:100;
  }
  .nav-btn{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;background:none;border:none;cursor:pointer;padding:8px 2px 0;position:relative;
  }
  .nav-icon-wrap{
    width:28px;height:28px;display:flex;align-items:center;justify-content:center;
    border-radius:8px;transition:all .2s cubic-bezier(.34,1.4,.64,1);
  }
  .nav-btn.active .nav-icon-wrap{
    background:rgba(255,107,157,0.18);
    transform:scale(1.08);
  }
  .nav-icon{font-size:20px;line-height:1}
  .nav-lbl{font-size:10px;font-weight:500;color:rgba(235,235,245,.38);letter-spacing:-.1px;transition:color .15s}
  .nav-btn.active .nav-lbl{color:#FF6B9D;font-weight:600}
  .nav-dot{
    position:absolute;top:6px;right:calc(50% - 18px);
    width:8px;height:8px;border-radius:50%;
    background:#FF453A;border:2px solid rgba(18,18,20,0.9);
  }

  /* ── FAB ── */
  .fab{
    position:absolute;bottom:98px;right:16px;
    width:52px;height:52px;
    border-radius:16px;
    background:linear-gradient(145deg,#FF6B9D,#FF7A6B);
    border:0.5px solid rgba(255,255,255,0.2);
    cursor:pointer;
    font-size:24px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 24px rgba(255,107,157,.45),0 2px 8px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,0.15);
    z-index:50;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s;
  }
  .fab:active{transform:scale(.88);box-shadow:0 2px 12px rgba(94,92,230,.3)}

  /* ── Back button ── */
  .back-btn{
    display:inline-flex;align-items:center;gap:5px;
    background:none;border:none;color:#6B6AEA;
    font-size:16px;cursor:pointer;padding:8px 0;margin-bottom:4px;
    font-family:inherit;font-weight:500;
    -webkit-tap-highlight-color:transparent;
  }
  .back-btn:active{opacity:0.7}
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="lo-data.js"></script>
<script src="lo-ai.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="lo-screens-1.jsx"></script>
<script type="text/babel" src="lo-screens-2.jsx"></script>
<script type="text/babel" src="lo-screens-3.jsx"></script>
<script type="text/babel" src="lo-screens-4.jsx"></script>
<script type="text/babel" src="lo-lifeos-v3.jsx"></script>
<script type="text/babel">

/* ── ONBOARDING ─────────────────────────────────────────────── */
const Onboarding = ({ onDone }) => {
  const [name, setName] = React.useState('');
  return (
    <div style={{
      height:'100vh',display:'flex',flexDirection:'column',alignItems:'center',
      justifyContent:'center',padding:'40px 32px',
      background:'linear-gradient(160deg,#0a0a0f 0%,#0d0d18 100%)',
      position:'relative',overflow:'hidden',
    }}>
      {/* Ambient orbs */}
      <div style={{ position:'absolute',top:'15%',left:'10%',width:220,height:220,borderRadius:'50%',background:'rgba(94,92,230,0.15)',filter:'blur(70px)',pointerEvents:'none' }}/>
      <div style={{ position:'absolute',bottom:'20%',right:'5%',width:180,height:180,borderRadius:'50%',background:'rgba(191,90,242,0.12)',filter:'blur(60px)',pointerEvents:'none' }}/>

      {/* App icon */}
      <div style={{
        width:96,height:96,
        borderRadius:'28px',
        background:'linear-gradient(145deg,#6B6AEA,#BF5AF2)',
        display:'flex',alignItems:'center',justifyContent:'center',
        fontSize:50,marginBottom:28,
        boxShadow:'0 12px 40px rgba(94,92,230,.5),0 4px 12px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,0.2)',
        position:'relative',zIndex:1,
      }}>🌀</div>

      <h1 style={{ fontSize:38,fontWeight:700,color:'#FFF',marginBottom:8,letterSpacing:-.5,position:'relative',zIndex:1 }}>LifeOS</h1>
      <p style={{ color:'rgba(235,235,245,.5)',fontSize:17,textAlign:'center',lineHeight:1.55,marginBottom:48,maxWidth:280,position:'relative',zIndex:1 }}>
        Tu sistema para capturar, ordenar y ejecutar lo que importa.
      </p>

      <div style={{ width:'100%',maxWidth:320,position:'relative',zIndex:1 }}>
        <p style={{ fontSize:12,fontWeight:600,color:'rgba(235,235,245,.4)',textTransform:'uppercase',letterSpacing:.8,marginBottom:10 }}>¿Cómo te llamás?</p>
        <input
          value={name}
          onChange={e=>setName(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&onDone(name)}
          placeholder="Tu nombre"
          style={{
            width:'100%',padding:'16px 18px',borderRadius:18,
            border:'0.5px solid rgba(255,255,255,0.12)',
            background:'rgba(28,28,30,0.85)',
            backdropFilter:'blur(20px)',WebkitBackdropFilter:'blur(20px)',
            color:'#FFF',fontSize:17,marginBottom:14,
          }}
          autoFocus
        />
        <button
          onClick={()=>onDone(name)}
          style={{
            width:'100%',padding:17,borderRadius:18,
            background:'linear-gradient(145deg,#6B6AEA,#5E5CE6)',
            color:'#FFF',border:'0.5px solid rgba(255,255,255,0.18)',
            fontSize:17,fontWeight:600,cursor:'pointer',
            boxShadow:'0 6px 24px rgba(94,92,230,.45),inset 0 1px 0 rgba(255,255,255,0.15)',
          }}
        >Empezar →</button>
      </div>
    </div>
  );
};

/* ── LIFEOS v3 NAV ───────────────────────────────────── */
const NAV_ICONS = {
  inbox:    <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/></svg>,
  timeline: <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="2" x2="12" y2="22"/><circle cx="12" cy="6" r="3"/><circle cx="12" cy="18" r="3"/></svg>,
  ai:       <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2l1.8 5.6L20 9.2l-5 3.7L16.2 20 12 16.4 7.8 20 9 12.9 4 9.2l6.2-1.6z"/></svg>,
  settings: <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 8.6 19a1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 5 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3a2 2 0 1 1 4 0v.1A1.7 1.7 0 0 0 15.4 5a1.7 1.7 0 0 0 1.88-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9c.4.17.74.38 1 .6.3.27.66.4 1.1.4H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>,
};

const MAIN_TABS = [
  { id:'inbox',    label:'Inbox' },
  { id:'timeline', label:'Timeline' },
  { id:'ai',       label:'AI' },
  { id:'settings', label:'Settings' },
];

const App = () => {
  const [onboarded, setOnboarded] = React.useState(()=>!!LOData.settings.get().onboarded);
  const [tab, setTab] = React.useState(()=>{
    const old = localStorage.getItem('lo_tab') || 'ai';
    const map = { hoy:'timeline', captura:'inbox', calendario:'timeline', tareas:'timeline', mas:'settings', 'ai-settings':'settings' };
    return ['inbox','timeline','ai','settings'].includes(old) ? old : (map[old] || 'ai');
  });
  const [showFocus, setShowFocus] = React.useState(false);
  const [unproc, setUnproc] = React.useState(0);
  const [screenKey, setKey] = React.useState(0);

  const refresh = () => setUnproc(LOData.captures.getUnprocessed().length);
  React.useEffect(()=>{ refresh(); window.addEventListener('lo:refresh',refresh); return()=>window.removeEventListener('lo:refresh',refresh); },[]);

  const navigate = dest => {
    if(dest==='focus'){ setShowFocus(true); return; }
    const map = { captura:'inbox', tareas:'timeline', calendario:'timeline', hoy:'timeline', mas:'settings', 'ai-settings':'settings' };
    const next = map[dest] || dest;
    if(['inbox','timeline','ai','settings'].includes(next)){
      setTab(next); localStorage.setItem('lo_tab',next); setKey(k=>k+1);
    }
  };
  const finish = name => { LOData.settings.save({ name:name||'Tomás', onboarded:true }); setOnboarded(true); };
  if(!onboarded) return <Onboarding onDone={finish}/>;

  return (
    <div id="shell">
      {showFocus && <FocusOverlay onClose={()=>setShowFocus(false)}/>}
      <div className="screen">
        <div key={screenKey} className="screen-pad fade-up">
          {tab==='inbox' && <LifeInboxScreen onNavigate={navigate}/>} 
          {tab==='timeline' && <LifeTimelineScreen onNavigate={navigate}/>} 
          {tab==='ai' && <LifeAIScreen onNavigate={navigate}/>} 
          {tab==='settings' && <LifeSettingsScreen onNavigate={navigate}/>} 
        </div>
      </div>
      <button className="fab" onClick={()=>navigate('inbox')} aria-label="Agregar">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.8" strokeLinecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
      <nav className="nav">
        {MAIN_TABS.map(t=>(
          <button key={t.id} className={`nav-btn${tab===t.id?' active':''}`} onClick={()=>navigate(t.id)}>
            {t.id==='inbox' && unproc>0 && <div className="nav-dot"/>}
            <div className="nav-icon-wrap" style={{ color:tab===t.id?'#FF6B9D':'rgba(235,235,245,0.42)' }}>{NAV_ICONS[t.id]}</div>
            <span className="nav-lbl" style={{ color:tab===t.id?'#FF6B9D':undefined }}>{t.label}</span>
          </button>
        ))}
      </nav>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
