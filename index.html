<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>LifeOS</title>
<style>
  /* ── Design System ────────────────────────────────────────── */
  :root{
    --bg:       #000000;
    --bg-1:     #1C1C1E;
    --bg-2:     #2C2C2E;
    --bg-3:     #3A3A3C;
    --text:     #FFFFFF;
    --text-2:   rgba(235,235,245,0.60);
    --text-3:   rgba(235,235,245,0.30);
    --sep:      rgba(84,84,88,0.45);
    --accent:   #00C8B1;
    --acc-dim:  rgba(0,200,177,0.18);
    --acc-glow: rgba(0,200,177,0.35);
    --red:      #FF453A;
    --orange:   #FF9F0A;
    --green:    #34C759;
    --blue:     #0A84FF;
    --purple:   #BF5AF2;
    --yellow:   #FFD60A;
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{height:100%;background:var(--bg)}
  body{
    height:100%;
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','SF Pro Display','Helvetica Neue',sans-serif;
    background:var(--bg);color:var(--text);overflow:hidden;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  #root{height:100%}
  ::-webkit-scrollbar{display:none}
  input,select,textarea{font-family:inherit;outline:none;-webkit-appearance:none}
  input[type=date],input[type=time]{color-scheme:dark}
  input[type=range]{-webkit-appearance:none;height:4px;border-radius:2px;background:var(--bg-3)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:24px;height:24px;border-radius:50%;
    background:#FFF;box-shadow:0 2px 8px rgba(0,0,0,.6);cursor:pointer;
  }
  details summary{list-style:none}
  details summary::-webkit-details-marker{display:none}

  /* ── Animations ── */
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes scaleIn{from{opacity:0;transform:scale(0.95)}to{opacity:1;transform:scale(1)}}
  @keyframes slideInRight{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:translateX(0)}}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0.45;transform:scale(0.68)}}
  @keyframes dotPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,69,58,0.5)}50%{box-shadow:0 0 0 4px rgba(255,69,58,0)}}
  .fade-up{animation:fadeUp .28s cubic-bezier(.25,.8,.25,1) both}
  .scale-in{animation:scaleIn .22s cubic-bezier(.25,.8,.25,1) both}
  .slide-in{animation:slideInRight .26s cubic-bezier(.25,.8,.25,1) both}

  /* ── Shell ── */
  #shell{
    max-width:430px;margin:0 auto;height:100vh;
    display:flex;flex-direction:column;
    position:relative;overflow:hidden;
    background:var(--bg);
  }
  @media(min-width:520px){
    body{background:#111}
    #shell{
      box-shadow:0 0 0 0.5px rgba(255,255,255,0.06),0 24px 80px rgba(0,0,0,.9);
    }
  }

  /* ── Screen ── */
  .screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
  .screen-pad{padding:56px 16px 104px}

  /* ── Card base — solid, no blur ── */
  .glass{
    background:var(--bg-1);
    border:0.5px solid var(--sep);
    border-radius:16px;
  }
  .glass-bright{
    background:var(--bg-2);
    border:0.5px solid rgba(84,84,88,0.55);
    border-radius:16px;
  }

  /* ── Bottom nav ── */
  .nav{
    position:absolute;bottom:0;left:0;right:0;
    height:82px;
    background:rgba(0,0,0,0.96);
    border-top:0.5px solid var(--sep);
    display:flex;padding:0 4px;
    padding-bottom:env(safe-area-inset-bottom,14px);
    z-index:100;
  }
  .nav-btn{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;background:none;border:none;cursor:pointer;padding:8px 2px 0;position:relative;
    transition:opacity .12s;
  }
  .nav-btn:active{opacity:0.55}
  .nav-icon-wrap{
    width:30px;height:30px;display:flex;align-items:center;justify-content:center;
    border-radius:10px;transition:all .2s cubic-bezier(.34,1.4,.64,1);
  }
  .nav-btn.active .nav-icon-wrap{
    background:var(--acc-dim);
    transform:scale(1.08) translateY(-1px);
  }
  .nav-lbl{
    font-size:10px;font-weight:500;
    color:var(--text-3);
    letter-spacing:-.1px;transition:color .15s;line-height:1;
  }
  .nav-btn.active .nav-lbl{color:var(--accent);font-weight:700}
  .nav-dot{
    position:absolute;top:5px;right:calc(50% - 19px);
    width:8px;height:8px;border-radius:50%;
    background:var(--red);border:2px solid #000;
    animation:dotPulse 2.2s ease-in-out infinite;
  }

  /* ── FAB ── */
  .fab{
    position:absolute;bottom:96px;right:16px;
    width:50px;height:50px;border-radius:15px;
    background:linear-gradient(145deg,#00D4BC,#00A896);
    border:none;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 24px var(--acc-glow),0 2px 6px rgba(0,0,0,.6);
    z-index:50;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s;
  }
  .fab:hover{transform:scale(1.07);box-shadow:0 10px 30px var(--acc-glow),0 2px 8px rgba(0,0,0,.5)}
  .fab:active{transform:scale(.88);box-shadow:0 3px 12px rgba(0,200,177,.25)}

  /* ── Back button ── */
  .back-btn{
    display:inline-flex;align-items:center;gap:5px;
    background:none;border:none;color:var(--accent);
    font-size:16px;cursor:pointer;padding:8px 0;margin-bottom:4px;
    font-family:inherit;font-weight:500;
    -webkit-tap-highlight-color:transparent;
  }
  .back-btn:active{opacity:0.6}

  /* ── Timeline card (Structured-style) ── */
  .tl-block{
    display:flex;align-items:flex-start;gap:0;
    border-radius:12px;overflow:hidden;
    margin-bottom:3px;
    transition:opacity .15s;
  }
  .tl-block:active{opacity:.7}
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="lo-data.js?v=8"></script>
<script src="lo-ai.js?v=8"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="lo-icons.jsx?v=8"></script>
<script type="text/babel" src="lo-screens-1.jsx?v=8"></script>
<script type="text/babel" src="lo-screens-2.jsx?v=8"></script>
<script type="text/babel" src="lo-screens-3.jsx?v=8"></script>
<script type="text/babel" src="lo-screens-4.jsx?v=8"></script>
<script type="text/babel" src="lo-screens-docs.jsx?v=8"></script>
<script type="text/babel">

/* ── ONBOARDING TOUR (multi-step, LifeOS-style) ─────────── */
const TourSlide = ({ title, accent, subtitle, children, bg }) => (
  <div style={{
    minHeight:'100vh', display:'flex', flexDirection:'column', padding:'60px 28px 36px',
    background:bg, position:'relative', overflow:'hidden',
  }}>
    {children}
  </div>
);

const Onboarding = ({ onDone }) => {
  const [step, setStep] = React.useState(0);
  const [name, setName] = React.useState('');
  const TOTAL = 5;
  const next = () => step<TOTAL-1 ? setStep(step+1) : finish();
  const back = () => step>0 && setStep(step-1);
  const finish = () => onDone(name);

  const Progress = () => (
    <div style={{ display:'flex',alignItems:'center',gap:12,marginBottom:42 }}>
      {step>0 ? (
        <button onClick={back} style={{ width:34,height:34,borderRadius:'50%',background:'rgba(255,255,255,0.08)',border:'0.5px solid rgba(255,255,255,0.12)',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'rgba(235,235,245,0.7)' }}>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 6 9 12 15 18"/></svg>
        </button>
      ) : <div style={{ width:34 }}/>}
      <div style={{ flex:1,height:5,background:'rgba(255,255,255,0.1)',borderRadius:3,overflow:'hidden' }}>
        <div style={{ height:'100%',width:`${((step+1)/TOTAL)*100}%`,background:'linear-gradient(90deg,#00C8B1,#00B5A0)',borderRadius:3,transition:'width .35s cubic-bezier(.4,0,.2,1)',boxShadow:'0 0 10px rgba(0,200,177,0.5)' }}/>
      </div>
      {step<TOTAL-1 ? (
        <button onClick={finish} style={{ background:'none',border:'none',color:'rgba(235,235,245,0.55)',fontSize:15,fontWeight:500,cursor:'pointer',padding:0 }}>Saltar</button>
      ) : <div style={{ width:50 }}/>}
    </div>
  );

  const Slide = ({ children }) => (
    <div style={{
      minHeight:'100vh',display:'flex',flexDirection:'column',padding:'52px 28px 40px',
      background:'#000000',position:'relative',overflow:'hidden',
    }}>
      <div style={{ position:'relative',zIndex:1,display:'flex',flexDirection:'column',flex:1 }}>
        <Progress/>
        {children}
      </div>
    </div>
  );

  const NextBtn = ({ label='Continuar', disabled }) => (
    <button onClick={next} disabled={disabled} style={{
      marginTop:'auto',width:'100%',padding:17,borderRadius:18,
      background:disabled?'rgba(44,44,46,0.7)':'linear-gradient(145deg,#00D4BC,#00B5A0)',
      color:disabled?'rgba(235,235,245,0.3)':'#FFF',
      border:disabled?'0.5px solid rgba(255,255,255,0.08)':'0.5px solid rgba(255,255,255,0.2)',
      fontSize:17,fontWeight:600,cursor:disabled?'default':'pointer',letterSpacing:-0.2,
      boxShadow:disabled?'none':'0 8px 28px rgba(0,200,177,.45),inset 0 1px 0 rgba(255,255,255,0.18)',
      display:'flex',alignItems:'center',justifyContent:'center',gap:7,
    }}>
      {label}
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </button>
  );

  // ── STEP 0: Welcome / intro
  if (step===0) return (
    <Slide>
      <div style={{ flex:1,display:'flex',flexDirection:'column',justifyContent:'center',alignItems:'center',textAlign:'center' }}>
        <div style={{
          width:104,height:104,borderRadius:30,background:'linear-gradient(145deg,#00D4BC,#0A84FF)',
          display:'flex',alignItems:'center',justifyContent:'center',marginBottom:32,color:'#FFF',
          boxShadow:'0 16px 50px rgba(0,200,177,.55),0 4px 16px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,0.22)',
        }}>
          <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
        </div>
        <h1 style={{ fontSize:38,fontWeight:700,color:'#FFF',margin:'0 0 12px',letterSpacing:-0.8,lineHeight:1.05 }}>
          Bienvenido a <span style={{ background:'linear-gradient(90deg,#00C8B1,#0A84FF)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text' }}>LifeOS</span>
        </h1>
        <p style={{ color:'rgba(235,235,245,.6)',fontSize:17,lineHeight:1.55,maxWidth:320,margin:0,letterSpacing:-0.1 }}>
          Tu sistema personal para capturar, ordenar y ejecutar lo que importa.
        </p>
      </div>
      <NextBtn label="Empezar"/>
    </Slide>
  );

  // ── STEP 1: A timeline of your day (LifeOS-style)
  if (step===1) return (
    <Slide>
      <h1 style={{ fontSize:34,fontWeight:700,color:'#FFF',margin:'0 0 8px',letterSpacing:-0.7,lineHeight:1.1 }}>
        Una <span style={{ color:'#00C8B1' }}>línea de tiempo</span> de tu día
      </h1>
      <p style={{ color:'rgba(235,235,245,.55)',fontSize:16,lineHeight:1.55,margin:'0 0 36px',letterSpacing:-0.1 }}>
        Eventos, tareas y recordatorios todos en un solo lugar, sincronizados automáticamente.
      </p>
      {/* Mock timeline */}
      <div style={{ background:'rgba(28,28,30,0.6)',borderRadius:24,border:'0.5px solid rgba(255,255,255,0.08)',padding:'18px 18px 20px',boxShadow:'0 12px 40px rgba(0,0,0,0.4),inset 0 1px 0 rgba(255,255,255,0.04)',backdropFilter:'blur(40px)' }}>
        {[
          { time:'08:00', title:'Tomar agua',          kind:'Recordatorio', col:'#FF453A', icon:'bell' },
          { time:'10:00', title:'Cálculo II',           kind:'Evento',       col:'#0A84FF', icon:'calendar' },
          { time:'12:30', title:'Almuerzo con mamá',    kind:'Evento',       col:'#30D158', icon:'calendar' },
          { time:'14:00', title:'Entregar informe',     kind:'Tarea',        col:'#FF9F0A', icon:'check-list' },
        ].map((it,i,arr)=>(
          <div key={i} style={{ display:'flex',gap:0,alignItems:'flex-start',position:'relative' }}>
            <div style={{ width:46,paddingTop:14,fontSize:12,fontWeight:700,color:'#FFF',fontVariantNumeric:'tabular-nums',textAlign:'right' }}>{it.time}</div>
            <div style={{ width:22,display:'flex',justifyContent:'center',position:'relative',flexShrink:0 }}>
              <div style={{ width:2,height:'100%',background:'rgba(84,84,88,0.3)',position:'absolute',top:0,bottom:0 }}/>
              <div style={{ width:10,height:10,borderRadius:'50%',background:it.col,marginTop:16,position:'relative',zIndex:1,boxShadow:`0 0 0 3px rgba(28,28,30,0.95), 0 0 8px ${it.col}90` }}/>
            </div>
            <div style={{ flex:1,padding:'10px 0 10px 6px' }}>
              <div style={{ display:'flex',alignItems:'center',gap:6,marginBottom:2 }}>
                <div style={{ color:it.col }}>
                  <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                    {it.icon==='calendar'&&<><rect x="3" y="4" width="18" height="18" rx="3"/><line x1="3" y1="10" x2="21" y2="10"/></>}
                    {it.icon==='bell'&&<><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></>}
                    {it.icon==='check-list'&&<><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></>}
                  </svg>
                </div>
                <span style={{ fontSize:9.5,fontWeight:700,color:it.col,textTransform:'uppercase',letterSpacing:0.6 }}>{it.kind}</span>
              </div>
              <p style={{ margin:0,fontSize:14,fontWeight:600,color:'#FFF',letterSpacing:-0.15 }}>{it.title}</p>
            </div>
          </div>
        ))}
      </div>
      <NextBtn/>
    </Slide>
  );

  // ── STEP 2: Capture
  if (step===2) return (
    <Slide>
      <h1 style={{ fontSize:34,fontWeight:700,color:'#FFF',margin:'0 0 8px',letterSpacing:-0.7,lineHeight:1.1 }}>
        Captura sin <span style={{ color:'#FF9F0A' }}>pensar</span>
      </h1>
      <p style={{ color:'rgba(235,235,245,.55)',fontSize:16,lineHeight:1.55,margin:'0 0 32px',letterSpacing:-0.1 }}>
        Apenas se te cruce una idea, tarea o gasto: anótalo. Después decides qué hacer con cada cosa.
      </p>
      <div style={{ display:'flex',flexDirection:'column',gap:12 }}>
        {[
          { icon:'lightbulb', col:'#FF9F0A', name:'Idea',         desc:'Pensamientos para revisar' },
          { icon:'list',      col:'#0A84FF', name:'Tarea',        desc:'Acciones que tienes que hacer' },
          { icon:'bell',      col:'#FF453A', name:'Recordatorio', desc:'Con horario y repetición' },
          { icon:'wallet',    col:'#30D158', name:'Gasto',        desc:'Dinero gastado' },
        ].map(it=>(
          <div key={it.name} style={{ display:'flex',alignItems:'center',gap:14,padding:'14px 16px',background:'rgba(28,28,30,0.6)',borderRadius:16,border:'0.5px solid rgba(255,255,255,0.06)' }}>
            <div style={{ width:44,height:44,borderRadius:13,background:`linear-gradient(145deg,${it.col}30,${it.col}1a)`,border:`0.5px solid ${it.col}38`,display:'flex',alignItems:'center',justifyContent:'center',color:it.col,flexShrink:0 }}>
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                {it.icon==='lightbulb'&&<><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 1 4 12.5c-.5.4-1 1-1 2v.5H9v-.5c0-1-.5-1.6-1-2A7 7 0 0 1 12 2z"/></>}
                {it.icon==='list'&&<><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></>}
                {it.icon==='bell'&&<><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></>}
                {it.icon==='wallet'&&<><path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4"/><path d="M4 6v12a2 2 0 0 0 2 2h14v-4"/><path d="M18 12a2 2 0 0 0 0 4h4v-4z"/></>}
              </svg>
            </div>
            <div style={{ flex:1,minWidth:0 }}>
              <p style={{ margin:'0 0 2px',fontSize:15,fontWeight:600,color:'#FFF',letterSpacing:-0.2 }}>{it.name}</p>
              <p style={{ margin:0,fontSize:13,color:'rgba(235,235,245,0.5)' }}>{it.desc}</p>
            </div>
          </div>
        ))}
      </div>
      <NextBtn/>
    </Slide>
  );

  // ── STEP 3: AI
  if (step===3) return (
    <Slide>
      <h1 style={{ fontSize:34,fontWeight:700,color:'#FFF',margin:'0 0 8px',letterSpacing:-0.7,lineHeight:1.1 }}>
        <span style={{ background:'linear-gradient(90deg,#BF5AF2,#64D2FF)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent',backgroundClip:'text' }}>IA</span> integrada
      </h1>
      <p style={{ color:'rgba(235,235,245,.55)',fontSize:16,lineHeight:1.55,margin:'0 0 32px',letterSpacing:-0.1 }}>
        Opcional. Conecta Ollama o Gemma localmente. Tus datos nunca salen de tu equipo.
      </p>
      <div style={{ display:'flex',flexDirection:'column',gap:14,flex:1 }}>
        {[
          { col:'#BF5AF2', t:'Auto-clasifica capturas', d:'La IA detecta si es tarea, idea o gasto' },
          { col:'#FF9F0A', t:'Insights diarios',         d:'Análisis de tu progreso en la pantalla Hoy' },
          { col:'#0A84FF', t:'Sugiere prioridades',      d:'Evalúa urgencia de tus tareas' },
        ].map(it=>(
          <div key={it.t} style={{ display:'flex',gap:14,alignItems:'flex-start',padding:'15px 18px',background:`linear-gradient(135deg,${it.col}14 0%,rgba(28,28,30,0.6) 80%)`,borderRadius:16,border:`0.5px solid ${it.col}28` }}>
            <div style={{ width:8,height:8,borderRadius:'50%',background:it.col,marginTop:8,flexShrink:0,boxShadow:`0 0 12px ${it.col}90` }}/>
            <div>
              <p style={{ margin:'0 0 3px',fontSize:15,fontWeight:600,color:'#FFF',letterSpacing:-0.2 }}>{it.t}</p>
              <p style={{ margin:0,fontSize:13,color:'rgba(235,235,245,0.55)',lineHeight:1.4 }}>{it.d}</p>
            </div>
          </div>
        ))}
      </div>
      <NextBtn/>
    </Slide>
  );

  // ── STEP 4: Name (final)
  return (
    <Slide>
      <h1 style={{ fontSize:34,fontWeight:700,color:'#FFF',margin:'0 0 8px',letterSpacing:-0.7,lineHeight:1.1 }}>
        ¿Cómo te <span style={{ color:'#00C8B1' }}>llamas</span>?
      </h1>
      <p style={{ color:'rgba(235,235,245,.55)',fontSize:16,lineHeight:1.55,margin:'0 0 36px',letterSpacing:-0.1 }}>
        Para saludarte como corresponde cada vez que abras la app.
      </p>
      <input
        value={name}
        onChange={e=>setName(e.target.value)}
        onKeyDown={e=>e.key==='Enter'&&name.trim()&&finish()}
        placeholder="Tu nombre"
        style={{
          width:'100%',padding:'18px 20px',borderRadius:18,
          border:'0.5px solid rgba(255,255,255,0.12)',
          background:'rgba(28,28,30,0.85)',
          backdropFilter:'blur(20px)',WebkitBackdropFilter:'blur(20px)',
          color:'#FFF',fontSize:18,marginBottom:14,letterSpacing:-0.2,
        }}
        autoFocus
      />
      <div style={{ flex:1 }}/>
      <button onClick={finish} style={{
        width:'100%',padding:17,borderRadius:18,
        background:'linear-gradient(145deg,#00D4BC,#00B5A0)',
        color:'#FFF',border:'0.5px solid rgba(255,255,255,0.2)',
        fontSize:17,fontWeight:600,cursor:'pointer',letterSpacing:-0.2,
        boxShadow:'0 8px 28px rgba(0,200,177,.45),inset 0 1px 0 rgba(255,255,255,0.18)',
        display:'flex',alignItems:'center',justifyContent:'center',gap:7,
      }}>
        Empezar
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </button>
    </Slide>
  );
};

/* ── NAV ICONS ── */
const NAV_ICONS = {
  inbox:    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>,
  timeline: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="14" x2="8.01" y2="14"/><line x1="12" y1="14" x2="12.01" y2="14"/><line x1="16" y1="14" x2="16.01" y2="14"/></svg>,
  ai:       <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.9" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3l1.5 5L19 9.5 13.5 11 12 16 10.5 11 5 9.5 10.5 8z"/><path d="M19 16l.6 2 2 .6-2 .6L19 21l-.6-1.8-2-.6 2-.6z"/></svg>,
  settings: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
};

/* ── MAIN TABS ───────────────────────────────────────────────── */
const MAIN_TABS = [
  { id:'inbox',    label:'Inbox'   },
  { id:'timeline', label:'Agenda'  },
  { id:'ai',       label:'IA'      },
  { id:'settings', label:'Config.' },
];
const SETTINGS_SCREENS = ['habitos','vida','recordar','focus-hub','ai-settings','gastos','docs','energia','replan','tareas','calendario'];

/* ── APP ─────────────────────────────────────────────────────── */
const App = () => {
  const [onboarded, setOnboarded] = React.useState(()=>!!LOData.settings.get().onboarded);
  const [tab, setTab]       = React.useState(()=>{ const t=localStorage.getItem('lo_tab')||'timeline'; return SETTINGS_SCREENS.includes(t)?'settings':t; });
  const [subScreen, setSub] = React.useState(()=>{ const t=localStorage.getItem('lo_tab'); return SETTINGS_SCREENS.includes(t)?t:null; });
  const [showFocus, setShowFocus] = React.useState(false);
  const [unproc, setUnproc]       = React.useState(0);
  const [screenKey, setKey]       = React.useState(0);

  const refresh = () => setUnproc(LOData.captures.getUnprocessed().length);
  React.useEffect(()=>{ refresh(); window.addEventListener('lo:refresh',refresh); return()=>window.removeEventListener('lo:refresh',refresh); },[]);

  const navigate = dest => {
    if(SETTINGS_SCREENS.includes(dest)){
      setTab('settings'); setSub(dest); localStorage.setItem('lo_tab',dest);
    } else if(dest==='focus'){
      setShowFocus(true);
    } else {
      setTab(dest); setSub(null); localStorage.setItem('lo_tab',dest);
    }
    setKey(k=>k+1);
  };

  const goSettings = () => { setTab('settings'); setSub(null); localStorage.setItem('lo_tab','settings'); setKey(k=>k+1); };
  const onTabClick = t => { if(t==='settings'&&tab==='settings') setSub(null); navigate(t); };
  const finish = name => { LOData.settings.save({ name:name||'Tomás', onboarded:true }); setOnboarded(true); };

  if(!onboarded) return <Onboarding onDone={finish}/>;

  const activeTab = SETTINGS_SCREENS.includes(tab)?'settings':tab;

  return (
    <div id="shell">
      {showFocus && <FocusOverlay onClose={()=>setShowFocus(false)}/>}

      <div className="screen">
        <div key={screenKey} className="screen-pad fade-up">

          {tab==='settings' && subScreen && (
            <button className="back-btn" onClick={goSettings}>
              <svg width="10" height="16" viewBox="0 0 10 16" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M8 1L2 8l6 7"/></svg>
              Config.
            </button>
          )}

          {tab==='inbox'    && <InboxScreen onNavigate={navigate}/>}
          {tab==='timeline' && <TimelineScreen onNavigate={navigate} onOpenFocus={()=>setShowFocus(true)}/>}
          {tab==='ai'       && <AIScreen onNavigate={navigate}/>}
          {tab==='settings' && !subScreen        && <SettingsScreen onNavigate={navigate}/>}
          {tab==='settings' && subScreen==='habitos'    && <HabitosScreen/>}
          {tab==='settings' && subScreen==='vida'       && <VidaScreen/>}
          {tab==='settings' && subScreen==='recordar'   && <RecordatoriosScreen/>}
          {tab==='settings' && subScreen==='gastos'     && <GastosScreen/>}
          {tab==='settings' && subScreen==='ai-settings'&& <AISettingsScreen/>}
          {tab==='settings' && subScreen==='docs'       && <DocsScreen/>}
          {tab==='settings' && subScreen==='energia'    && <EnergyScreen/>}
          {tab==='settings' && subScreen==='replan'     && <ReplanScreen onNavigate={navigate}/>}
          {tab==='settings' && subScreen==='tareas'     && <TareasScreen/>}
          {tab==='settings' && subScreen==='calendario' && <CalendarioScreen/>}
          {tab==='settings' && subScreen==='focus-hub'  && (
            <div style={{ display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'60vh',gap:18 }}>
              <div style={{ width:88,height:88,borderRadius:26,background:'linear-gradient(145deg,#00D4BC,#00B5A0)',display:'flex',alignItems:'center',justifyContent:'center',color:'#FFF',boxShadow:'0 12px 36px rgba(0,200,177,0.5),inset 0 1px 0 rgba(255,255,255,0.2)' }}>
                <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
              </div>
              <div style={{ textAlign:'center' }}>
                <p style={{ margin:'0 0 4px',fontSize:22,fontWeight:700,color:'#FFF',letterSpacing:-0.4 }}>Focus</p>
                <p style={{ margin:0,fontSize:14,color:'rgba(235,235,245,0.45)' }}>Bloque de trabajo profundo</p>
              </div>
              <button onClick={()=>setShowFocus(true)} style={{ display:'inline-flex',alignItems:'center',gap:8,padding:'14px 32px',borderRadius:16,background:'linear-gradient(145deg,#00D4BC,#00B5A0)',color:'#FFF',border:'0.5px solid rgba(255,255,255,0.2)',fontSize:16,fontWeight:600,cursor:'pointer',boxShadow:'0 6px 24px rgba(0,200,177,.4),inset 0 1px 0 rgba(255,255,255,0.2)' }}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="6 4 20 12 6 20"/></svg> Iniciar Focus
              </button>
            </div>
          )}
        </div>
      </div>

      {/* FAB — quick capture, hidden on inbox (already has input) */}
      {tab!=='inbox' && (
        <button className="fab" onClick={()=>navigate('inbox')}>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      )}

      {/* Bottom nav */}
      <nav className="nav">
        {MAIN_TABS.map(t=>(
          <button key={t.id} className={`nav-btn${activeTab===t.id?' active':''}`} onClick={()=>onTabClick(t.id)}>
            {t.id==='inbox' && unproc>0 && <div className="nav-dot"/>}
            <div className="nav-icon-wrap" style={{ color:activeTab===t.id?'#00C8B1':'rgba(235,235,245,0.42)' }}>
              {NAV_ICONS[t.id]}
            </div>
            <span className="nav-lbl">{t.label}</span>
          </button>
        ))}
      </nav>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
