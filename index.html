    var p = document.body || document.documentElement;

      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;

      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {

        s.textContent = await r.text();
        s.removeAttribute('src');

      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }

  <script type="__bundler/template">"<!DOCTYPE html>\n<html lang=\"es\"><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"#0B0B11\">\n<meta name=\"apple-mobile-web-app-capable\" content=\"yes\">\n<meta name=\"apple-mobile-web-app-status-bar-style\" content=\"black-translucent\">\n<meta name=\"apple-mobile-web-app-title\" content=\"LifeOS\">\n<meta name=\"description\" content=\"LifeOS \u2014 Tu d\u00eda, visualizado. Planificador diario premium con timeline visual.\">\n<title>LifeOS \u2014 Tu d\u00eda, visualizado.</title>\n\n\n\n<style>/* lifeos-motion.css \u2014 animation primitives shared by all screens */\n\n/* \u2500\u2500\u2500 easing tokens \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n:root {\n  --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);\n  --ease-out-back: cubic-bezier(0.34, 1.56, 0.64, 1);\n  --ease-spring:   cubic-bezier(0.5, 1.8, 0.4, 1.0);\n  --ease-smooth:   cubic-bezier(0.4, 0, 0.2, 1);\n}\n\n/* \u2500\u2500\u2500 keyframes \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n@keyframes lo-sheet-up {\n  from { transform: translateY(100%); }\n  to   { transform: translateY(0%); }\n}\n\n@keyframes lo-fade-in {\n  from { opacity: 0; }\n  to   { opacity: 1; }\n}\n\n@keyframes lo-scale-in {\n  from { transform: scale(0.94); opacity: 0; }\n  to   { transform: scale(1);    opacity: 1; }\n}\n\n@keyframes lo-slide-in {\n  from { transform: translateY(8px); opacity: 0; }\n  to   { transform: translateY(0);   opacity: 1; }\n}\n\n@keyframes lo-pop {\n  0%   { transform: scale(1); }\n  40%  { transform: scale(1.18); }\n  100% { transform: scale(1); }\n}\n\n@keyframes lo-pulse {\n  0%, 100% { box-shadow: 0 0 0 0 var(--pulse-c, rgba(255,135,101,0.5)); }\n  50%      { box-shadow: 0 0 0 4px var(--pulse-c-end, rgba(255,135,101,0)); }\n}\n\n@keyframes lo-breath {\n  0%, 100% { transform: scale(1); }\n  50%      { transform: scale(1.04); }\n}\n\n@keyframes lo-shimmer {\n  0%   { background-position: -200% 0; }\n  100% { background-position: 200% 0; }\n}\n\n@keyframes lo-detail-expand {\n  from { transform: scale(0.92) translateY(20px); opacity: 0; }\n  to   { transform: scale(1)    translateY(0);   opacity: 1; }\n}\n\n/* \u2500\u2500\u2500 utility classes \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */\n.lo-sheet-enter { animation: lo-sheet-up 0.42s var(--ease-out-quart); }\n.lo-fade        { animation: lo-fade-in 0.3s var(--ease-smooth); }\n.lo-scale-in    { animation: lo-scale-in 0.32s var(--ease-out-back); }\n.lo-slide-in    { animation: lo-slide-in 0.4s var(--ease-out-quart); }\n.lo-pop         { animation: lo-pop 0.35s var(--ease-out-back); }\n.lo-pulse       { animation: lo-pulse 2.0s var(--ease-smooth) infinite; }\n.lo-breath      { animation: lo-breath 2.6s var(--ease-smooth) infinite; }\n.lo-detail      { animation: lo-detail-expand 0.42s var(--ease-out-quart); }\n\n/* Staggered children \u2014 use --i: <index> as inline style */\n.lo-stagger > * {\n  animation: lo-slide-in 0.5s var(--ease-out-quart) both;\n  animation-delay: calc(var(--i, 0) * 40ms);\n}\n\n/* Press feedback (use on any button) */\n.lo-press {\n  transition: transform 0.15s var(--ease-smooth), filter 0.15s;\n}\n.lo-press:active {\n  transform: scale(0.96);\n  filter: brightness(0.9);\n}\n\n/* Soft hover lift */\n.lo-lift {\n  transition: transform 0.2s var(--ease-out-quart), box-shadow 0.2s;\n}\n.lo-lift:hover {\n  transform: translateY(-1px);\n}\n\n/* Shimmer placeholder (used in empty/loading states) */\n.lo-shimmer {\n  background: linear-gradient(90deg,\n    rgba(255,255,255,0.04) 0%,\n    rgba(255,255,255,0.08) 50%,\n    rgba(255,255,255,0.04) 100%);\n  background-size: 200% 100%;\n  animation: lo-shimmer 1.8s linear infinite;\n}\n\n/* Tab cross-fade container */\n.lo-tab-fade > * {\n  animation: lo-fade-in 0.28s var(--ease-smooth);\n}\n</style>\n<style>\n  html, body {\n    margin: 0; padding: 0;\n    background: #050508;\n    overflow: hidden;\n    width: 100%;\n    height: 100vh;\n    height: 100dvh;\n  }\n  body, * { box-sizing: border-box; }\n  body {\n    font-family: -apple-system, BlinkMacSystemFont, \"SF Pro Text\", \"Inter\", system-ui, sans-serif;\n    -webkit-font-smoothing: antialiased;\n    touch-action: manipulation;\n    overscroll-behavior: none;\n  }\n  input, button, textarea { font-family: inherit; }\n  *::-webkit-scrollbar { display: none; }\n  * { scrollbar-width: none; }\n\n  #root {\n    width: 100%;\n    height: 100vh;\n    height: 100dvh;\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    position: relative;\n  }\n\n  /* Splash while React boots */\n  .lo-boot {\n    position: fixed; inset: 0; z-index: 100;\n    background: #0B0B11;\n    display: flex; align-items: center; justify-content: center;\n    transition: opacity .35s ease-out;\n  }\n  .lo-boot.gone { opacity: 0; pointer-events: none; }\n  .lo-boot-mark {\n    width: 84px; height: 84px; border-radius: 24px;\n    background: linear-gradient(160deg, #FF8B6B, #F46B4D);\n    box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 12px 32px rgba(255,135,101,.4);\n    display: flex; align-items: center; justify-content: center;\n    color: #fff; font-size: 42px; font-weight: 700; letter-spacing: -1px;\n    animation: lo-boot-pulse 1.4s ease-in-out infinite;\n  }\n  @keyframes lo-boot-pulse {\n    0%, 100% { transform: scale(1); }\n    50% { transform: scale(1.05); }\n  }\n\n  /* App shell \u2014 fills viewport on mobile, framed iPhone on desktop */\n  .app-shell {\n    width: 100%;\n    height: 100%;\n    background: #0B0B11;\n    position: relative;\n    overflow: hidden;\n  }\n\n  /* Desktop only (mouse pointer, wide screen): iPhone frame */\n  @media (min-width: 1200px) and (min-height: 700px) and (pointer: fine) {\n    .app-shell {\n      width: 390px;\n      height: 844px;\n      border-radius: 47px;\n      box-shadow:\n        0 0 0 9px #1a1a20,\n        0 0 0 10px #2a2a32,\n        0 30px 80px rgba(0,0,0,.55),\n        0 0 80px rgba(255,135,101,.06);\n    }\n    .app-shell::before {\n      content: \"\";\n      position: absolute;\n      top: 11px; left: 50%;\n      transform: translateX(-50%);\n      width: 126px; height: 37px;\n      border-radius: 24px;\n      background: #000;\n      z-index: 100;\n      pointer-events: none;\n    }\n    .app-shell::after {\n      content: \"\";\n      position: absolute;\n      bottom: 8px; left: 50%;\n      transform: translateX(-50%);\n      width: 139px; height: 5px;\n      border-radius: 100px;\n      background: rgba(255,255,255,.7);\n      z-index: 100;\n      pointer-events: none;\n    }\n    .app-shell .ios-content { padding-top: 58px; padding-bottom: 34px; }\n    body { padding: 20px; }\n  }\n</style>\n</head>\n<body>\n\n<!-- Boot splash, hidden once React mounts -->\n<div class=\"lo-boot\" id=\"lo-boot\">\n  <div class=\"lo-boot-mark\">L</div>\n</div>\n\n<div id=\"root\"></div>\n\n<noscript>\n  <div style=\"position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;background:#0B0B11;font-family:system-ui;padding:24px;text-align:center\">\n    LifeOS necesita JavaScript activado para funcionar.\n  </div>\n</noscript>\n\n<script src=\"50cf19c2-3586-4432-89e5-b0e47914db38\" integrity=\"sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkL
