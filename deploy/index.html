<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Life OS</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{height:100%;background:#000}
  body{
    height:100%;
    font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Helvetica Neue',sans-serif;
    background:#000;color:#FFF;overflow:hidden;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  #root{height:100%}
  ::-webkit-scrollbar{display:none}
  input,select,textarea{font-family:inherit;outline:none;-webkit-appearance:none}
  input[type=date],input[type=time]{color-scheme:dark}
  input[type=range]{-webkit-appearance:none;height:4px;border-radius:2px;background:rgba(84,84,88,0.5)}
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:24px;height:24px;border-radius:50%;
    background:#FFF;box-shadow:0 2px 8px rgba(0,0,0,.5),0 0 0 0.5px rgba(255,255,255,0.3);cursor:pointer;
  }
  details summary{list-style:none}
  details summary::-webkit-details-marker{display:none}

  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  @keyframes scaleIn{from{opacity:0;transform:scale(0.94)}to{opacity:1;transform:scale(1)}}
  @keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
  .fade-up{animation:fadeUp .3s cubic-bezier(.34,1.2,.64,1) both}
  .scale-in{animation:scaleIn .25s cubic-bezier(.34,1.2,.64,1) both}

  /* ── Ambient Background ── */
  body::before{
    content:'';
    position:fixed;inset:0;
    background:
      radial-gradient(ellipse at 15% 40%,rgba(94,92,230,0.18) 0%,transparent 55%),
      radial-gradient(ellipse at 85% 10%,rgba(191,90,242,0.14) 0%,transparent 50%),
      radial-gradient(ellipse at 65% 85%,rgba(10,132,255,0.10) 0%,transparent 50%),
      radial-gradient(ellipse at 30% 90%,rgba(48,209,88,0.06) 0%,transparent 45%);
    pointer-events:none;z-index:0;
  }

  /* ── Shell ── */
  #shell{
    max-width:430px;margin:0 auto;height:100vh;
    display:flex;flex-direction:column;
    position:relative;overflow:hidden;
    background:transparent;
    z-index:1;
  }
  @media(min-width:520px){
    body{background:#0a0a0f}
    #shell{
      box-shadow:
        0 0 0 0.5px rgba(255,255,255,0.07),
        0 30px 100px rgba(0,0,0,.95),
        inset 0 0 0 0.5px rgba(255,255,255,0.04);
      border-radius:0;
    }
  }

  /* ── Screen ── */
  .screen{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain}
  .screen-pad{padding:60px 16px 108px}

  /* ── Glass card base ── */
  .glass{
    background:rgba(28,28,30,0.78);
    backdrop-filter:blur(40px) saturate(180%);
    -webkit-backdrop-filter:blur(40px) saturate(180%);
    border:0.5px solid rgba(255,255,255,0.10);
  }
  .glass-bright{
    background:rgba(44,44,46,0.72);
    backdrop-filter:blur(40px) saturate(180%);
    -webkit-backdrop-filter:blur(40px) saturate(180%);
    border:0.5px solid rgba(255,255,255,0.13);
  }

  /* ── Bottom nav ── */
  .nav{
    position:absolute;bottom:0;left:0;right:0;
    height:83px;
    background:rgba(18,18,20,0.88);
    backdrop-filter:blur(50px) saturate(200%);
    -webkit-backdrop-filter:blur(50px) saturate(200%);
    border-top:0.5px solid rgba(255,255,255,0.10);
    display:flex;padding:0 4px;
    padding-bottom:env(safe-area-inset-bottom,16px);
    z-index:100;
  }
  .nav-btn{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;background:none;border:none;cursor:pointer;padding:8px 2px 0;position:relative;
  }
  .nav-icon-wrap{
    width:28px;height:28px;display:flex;align-items:center;justify-content:center;
    border-radius:8px;transition:all .2s cubic-bezier(.34,1.4,.64,1);
  }
  .nav-btn.active .nav-icon-wrap{
    background:rgba(94,92,230,0.2);
    transform:scale(1.08);
  }
  .nav-icon{font-size:20px;line-height:1}
  .nav-lbl{font-size:10px;font-weight:500;color:rgba(235,235,245,.38);letter-spacing:-.1px;transition:color .15s}
  .nav-btn.active .nav-lbl{color:#6B6AEA;font-weight:600}
  .nav-dot{
    position:absolute;top:6px;right:calc(50% - 18px);
    width:8px;height:8px;border-radius:50%;
    background:#FF453A;border:2px solid rgba(18,18,20,0.9);
  }

  /* ── FAB ── */
  .fab{
    position:absolute;bottom:98px;right:16px;
    width:52px;height:52px;
    border-radius:16px;
    background:linear-gradient(145deg,#6B6AEA,#5E5CE6);
    border:0.5px solid rgba(255,255,255,0.2);
    cursor:pointer;
    font-size:24px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 24px rgba(94,92,230,.50),0 2px 8px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,0.15);
    z-index:50;
    transition:transform .18s cubic-bezier(.34,1.56,.64,1),box-shadow .18s;
  }
  .fab:active{transform:scale(.88);box-shadow:0 2px 12px rgba(94,92,230,.3)}

  /* ── Back button ── */
  .back-btn{
    display:inline-flex;align-items:center;gap:5px;
    background:none;border:none;color:#6B6AEA;
    font-size:16px;cursor:pointer;padding:8px 0;margin-bottom:4px;
    font-family:inherit;font-weight:500;
    -webkit-tap-highlight-color:transparent;
  }
  .back-btn:active{opacity:0.7}
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="lo-data.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="lo-screens-1.jsx"></script>
<script type="text/babel" src="lo-screens-2.jsx"></script>
<script type="text/babel" src="lo-screens-3.jsx"></script>
<script type="text/babel" src="lo-screens-4.jsx"></script>
<script type="text/babel">

/* ── ONBOARDING ─────────────────────────────────────────────── */
const Onboarding = ({ onDone }) => {
  const [name, setName] = React.useState('');
  return (
    <div style={{
      height:'100vh',display:'flex',flexDirection:'column',alignItems:'center',
      justifyContent:'center',padding:'40px 32px',
      background:'linear-gradient(160deg,#0a0a0f 0%,#0d0d18 100%)',
      position:'relative',overflow:'hidden',
    }}>
      {/* Ambient orbs */}
      <div style={{ position:'absolute',top:'15%',left:'10%',width:220,height:220,borderRadius:'50%',background:'rgba(94,92,230,0.15)',filter:'blur(70px)',pointerEvents:'none' }}/>
      <div style={{ position:'absolute',bottom:'20%',right:'5%',width:180,height:180,borderRadius:'50%',background:'rgba(191,90,242,0.12)',filter:'blur(60px)',pointerEvents:'none' }}/>

      {/* App icon */}
      <div style={{
        width:96,height:96,
        borderRadius:'28px',
        background:'linear-gradient(145deg,#6B6AEA,#BF5AF2)',
        display:'flex',alignItems:'center',justifyContent:'center',
        fontSize:50,marginBottom:28,
        boxShadow:'0 12px 40px rgba(94,92,230,.5),0 4px 12px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,0.2)',
        position:'relative',zIndex:1,
      }}>🌀</div>

      <h1 style={{ fontSize:38,fontWeight:700,color:'#FFF',marginBottom:8,letterSpacing:-.5,position:'relative',zIndex:1 }}>Life OS</h1>
      <p style={{ color:'rgba(235,235,245,.5)',fontSize:17,textAlign:'center',lineHeight:1.55,marginBottom:48,maxWidth:280,position:'relative',zIndex:1 }}>
        Tu sistema para capturar, ordenar y ejecutar lo que importa.
      </p>

      <div style={{ width:'100%',maxWidth:320,position:'relative',zIndex:1 }}>
        <p style={{ fontSize:12,fontWeight:600,color:'rgba(235,235,245,.4)',textTransform:'uppercase',letterSpacing:.8,marginBottom:10 }}>¿Cómo te llamás?</p>
        <input
          value={name}
          onChange={e=>setName(e.target.value)}
          onKeyDown={e=>e.key==='Enter'&&onDone(name)}
          placeholder="Tu nombre"
          style={{
            width:'100%',padding:'16px 18px',borderRadius:18,
            border:'0.5px solid rgba(255,255,255,0.12)',
            background:'rgba(28,28,30,0.85)',
            backdropFilter:'blur(20px)',WebkitBackdropFilter:'blur(20px)',
            color:'#FFF',fontSize:17,marginBottom:14,
          }}
          autoFocus
        />
        <button
          onClick={()=>onDone(name)}
          style={{
            width:'100%',padding:17,borderRadius:18,
            background:'linear-gradient(145deg,#6B6AEA,#5E5CE6)',
            color:'#FFF',border:'0.5px solid rgba(255,255,255,0.18)',
            fontSize:17,fontWeight:600,cursor:'pointer',
            boxShadow:'0 6px 24px rgba(94,92,230,.45),inset 0 1px 0 rgba(255,255,255,0.15)',
          }}
        >Empezar →</button>
      </div>
    </div>
  );
};

/* ── NAV ICONS ── */
const NAV_ICONS = {
  hoy:        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>,
  captura:    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>,
  calendario: <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>,
  tareas:     <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>,
  mas:        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="8" cy="8" r="2"/><circle cx="16" cy="8" r="2"/><circle cx="8" cy="16" r="2"/><circle cx="16" cy="16" r="2"/></svg>,
};

/* ── MAIN TABS ───────────────────────────────────────────────── */
const MAIN_TABS = [
  { id:'hoy',        label:'Hoy'    },
  { id:'captura',    label:'Cap.'   },
  { id:'calendario', label:'Agenda' },
  { id:'tareas',     label:'Tareas' },
  { id:'mas',        label:'Más'    },
];
const MAS_SCREENS = ['habitos','vida','recordar','focus-hub'];

/* ── APP ─────────────────────────────────────────────────────── */
const App = () => {
  const [onboarded, setOnboarded] = React.useState(()=>!!LOData.settings.get().onboarded);
  const [tab, setTab]       = React.useState(()=>{ const t=localStorage.getItem('lo_tab')||'hoy'; return MAS_SCREENS.includes(t)?'mas':t; });
  const [subScreen, setSub] = React.useState(()=>{ const t=localStorage.getItem('lo_tab'); return MAS_SCREENS.includes(t)?t:null; });
  const [showFocus, setShowFocus] = React.useState(false);
  const [unproc, setUnproc]       = React.useState(0);
  const [screenKey, setKey]       = React.useState(0);

  const refresh = () => setUnproc(LOData.captures.getUnprocessed().length);
  React.useEffect(()=>{ refresh(); window.addEventListener('lo:refresh',refresh); return()=>window.removeEventListener('lo:refresh',refresh); },[]);

  const navigate = dest => {
    if(MAS_SCREENS.includes(dest)){
      setTab('mas'); setSub(dest); localStorage.setItem('lo_tab',dest);
    } else if(dest==='focus'){
      setShowFocus(true);
    } else {
      setTab(dest); setSub(null); localStorage.setItem('lo_tab',dest);
    }
    setKey(k=>k+1);
  };

  const goMas = () => { setTab('mas'); setSub(null); localStorage.setItem('lo_tab','mas'); setKey(k=>k+1); };
  const onTabClick = t => { if(t==='mas'&&tab==='mas') setSub(null); navigate(t); };
  const finish = name => { LOData.settings.save({ name:name||'Tomás', onboarded:true }); setOnboarded(true); };

  if(!onboarded) return <Onboarding onDone={finish}/>;

  const activeTab = MAS_SCREENS.includes(tab)?'mas':tab;

  return (
    <div id="shell">
      {showFocus && <FocusOverlay onClose={()=>setShowFocus(false)}/>}

      <div className="screen">
        <div key={screenKey} className="screen-pad fade-up">

          {tab==='mas' && subScreen && (
            <button className="back-btn" onClick={goMas}>
              <svg width="10" height="16" viewBox="0 0 10 16" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M8 1L2 8l6 7"/></svg>
              Más
            </button>
          )}

          {tab==='hoy'        && <HoyScreen onNavigate={navigate} onOpenFocus={()=>setShowFocus(true)}/>}
          {tab==='captura'    && <CapturaScreen onNavigate={navigate}/>}
          {tab==='calendario' && <CalendarioScreen/>}
          {tab==='tareas'     && <TareasScreen/>}
          {tab==='mas' && !subScreen    && <MasHub onNavigate={navigate}/>}
          {tab==='mas' && subScreen==='habitos'   && <HabitosScreen/>}
          {tab==='mas' && subScreen==='vida'      && <VidaScreen/>}
          {tab==='mas' && subScreen==='recordar'  && <RecordatoriosScreen/>}
          {tab==='mas' && subScreen==='focus-hub' && (
            <div style={{ display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'60vh',gap:16 }}>
              <div style={{ width:80,height:80,borderRadius:'24px',background:'linear-gradient(145deg,rgba(94,92,230,0.3),rgba(94,92,230,0.15))',border:'0.5px solid rgba(94,92,230,0.4)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:38 }}>🎯</div>
              <button onClick={()=>setShowFocus(true)} style={{ padding:'16px 44px',borderRadius:18,background:'linear-gradient(145deg,#6B6AEA,#5E5CE6)',color:'#FFF',border:'0.5px solid rgba(255,255,255,0.18)',fontSize:17,fontWeight:700,cursor:'pointer',boxShadow:'0 6px 24px rgba(94,92,230,.4)' }}>▶ Iniciar Focus</button>
            </div>
          )}
        </div>
      </div>

      {/* FAB */}
      {tab!=='captura' && (
        <button className="fab" onClick={()=>navigate('captura')}>
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
        </button>
      )}

      {/* Bottom nav */}
      <nav className="nav">
        {MAIN_TABS.map(t=>(
          <button key={t.id} className={`nav-btn${activeTab===t.id?' active':''}`} onClick={()=>onTabClick(t.id)}>
            {t.id==='captura' && unproc>0 && <div className="nav-dot"/>}
            <div className="nav-icon-wrap" style={{ color:activeTab===t.id?'#6B6AEA':'rgba(235,235,245,0.42)' }}>
              {NAV_ICONS[t.id]}
            </div>
            <span className="nav-lbl">{t.label}</span>
          </button>
        ))}
      </nav>
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
